name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch Groovy 2.4 (the version Jenkins bundles) for the probe test
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/groovy-all.jar" \
            https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar
          echo "JFLEET_GROOVY_JAR=$RUNNER_TEMP/groovy-all.jar" >> "$GITHUB_ENV"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
      - run: jenkins-fleet --version
